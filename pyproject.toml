[project]
name = "financebench-thesis"
version = "0.1.0"
description = "Vector RAG vs. Vectorless RAG vs. Long-Context LLMs on FinanceBench"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "google-genai>=0.3",
    "anthropic>=0.40",
    "openai>=1.50",
    "voyageai>=0.3",
    "pymupdf4llm>=1.28.0",
    "transformers>=5.13.0",
    "sentence-transformers>=5.6.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.10.0",
    "tiktoken>=0.13.0",
    "pyarrow>=25.0.0",
    "groq>=1.6.0",
    "litellm>=1.83",
    "pypdf2>=3.0",
    "pyyaml>=6.0",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.1",
]
